# Builds and validates the plugin on macOS (VST3 + AU), Windows (VST3) and Linux (VST3).
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb ninja-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (VST3)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   curl -sSLo pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip && unzip -q pv.zip && PV=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) curl -sSLo pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip && unzip -q pv.zip && PV=./pluginval.exe ;;
            Linux)   curl -sSLo pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip && unzip -q pv.zip && PV="xvfb-run -a ./pluginval" ;;
          esac
          VST3=$(find build -name "*.vst3" -maxdepth 5 -type d | head -1)
          $PV --strictness-level 10 --validate-in-process "$VST3"

      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$(find build -name '*.component' -maxdepth 5 -type d | head -1)" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Aima Aimx

      # Zip inside the job: GitHub's artifact upload drops file permissions,
      # which would leave the macOS bundles unable to load.
      - name: Package
        shell: bash
        run: |
          OUT="AIMixAssistant-${{ runner.os }}"
          REL=$(dirname "$(find build -path '*AIMixAssistant_artefacts/Release/VST3' -maxdepth 4 -type d | head -1)")
          mkdir -p "$OUT"
          cp -R "$REL/VST3/"*.vst3 "$OUT/"
          case "${{ runner.os }}" in
            macOS)
              cp -R "$REL/AU/"*.component "$OUT/"
              cp -R "$REL/Standalone/"*.app "$OUT/"
              printf '%s\n' \
                "AI Mix Assistant for macOS (Apple Silicon + Intel)" "" \
                "1. Copy 'AI Mix Assistant.component' to ~/Library/Audio/Plug-Ins/Components/  (Logic, GarageBand)" \
                "2. Copy 'AI Mix Assistant.vst3' to ~/Library/Audio/Plug-Ins/VST3/  (Ableton, Cubase, Reaper, Bitwig...)" \
                "3. This build is not notarized. In Terminal run:" \
                "   xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/'AI Mix Assistant.component' ~/Library/Audio/Plug-Ins/VST3/'AI Mix Assistant.vst3'" \
                "4. Restart your DAW and rescan plug-ins." > "$OUT/INSTALL.txt"
              # Every binary must carry a native Apple Silicon slice as well as Intel.
              for b in "$OUT"/*.component/Contents/MacOS/* "$OUT"/*.vst3/Contents/MacOS/* "$OUT"/*.app/Contents/MacOS/*; do
                echo "$b: $(lipo -archs "$b")"; lipo -archs "$b" | grep -q arm64 && lipo -archs "$b" | grep -q x86_64
              done
              # Apple Silicon refuses to load unsigned code, and the AU bundle comes
              # out of the build unsigned. Ad-hoc sign every bundle (no Apple ID needed).
              for b in "$OUT"/*.component "$OUT"/*.vst3 "$OUT"/*.app; do
                codesign --force --deep --sign - "$b"
                codesign --verify --deep --strict "$b"
              done
              ditto -c -k --keepParent "$OUT" "$OUT.zip"

              # Double-click installer: puts the AU and VST3 where every DAW
              # looks. Files written by Installer are not quarantined, so the
              # plug-ins load without any Terminal step.
              ROOT=pkgroot
              mkdir -p "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Applications"
              ditto "$OUT/AI Mix Assistant.component" "$ROOT/Library/Audio/Plug-Ins/Components/AI Mix Assistant.component"
              ditto "$OUT/AI Mix Assistant.vst3" "$ROOT/Library/Audio/Plug-Ins/VST3/AI Mix Assistant.vst3"
              ditto "$OUT/AI Mix Assistant.app" "$ROOT/Applications/AI Mix Assistant.app"
              # Always install to these exact paths (never "relocate" onto an old copy elsewhere).
              pkgbuild --analyze --root "$ROOT" components.plist
              i=0; while [ $i -lt 10 ] && plutil -replace "$i.BundleIsRelocatable" -bool NO components.plist 2>/dev/null; do i=$((i+1)); done
              plutil -p components.plist
              mkdir -p scripts
              printf '%s\n' '#!/bin/sh' 'killall -9 AudioComponentRegistrar 2>/dev/null || true' 'exit 0' > scripts/postinstall
              chmod +x scripts/postinstall
              pkgbuild --root "$ROOT" --component-plist components.plist --scripts scripts \
                --identifier com.kalprod.aimixassistant --version "1.0.${{ github.run_number }}" \
                --install-location / plugins.pkg
              productbuild --package plugins.pkg AIMixAssistant-macOS.pkg
              pkgutil --payload-files AIMixAssistant-macOS.pkg | grep -E "component$|vst3$|app$" ;;
            Windows)
              cp "$REL/Standalone/"*.exe "$OUT/"
              printf '%s\r\n' \
                "AI Mix Assistant for Windows (64-bit)" "" \
                '1. Copy the "AI Mix Assistant.vst3" folder to C:\Program Files\Common Files\VST3' \
                "2. Restart your DAW and rescan plug-ins." \
                "If Windows SmartScreen warns about the standalone .exe, choose More info > Run anyway." > "$OUT/INSTALL.txt"
              7z a -tzip "$OUT.zip" "$OUT" > /dev/null ;;
            Linux)
              cp "$REL/Standalone/"* "$OUT/"
              printf '%s\n' \
                "AI Mix Assistant for Linux (x86-64)" "" \
                "1. Copy 'AI Mix Assistant.vst3' to ~/.vst3/" \
                "2. Needs libasound2, libfreetype6 and libfontconfig1." \
                "3. Restart your DAW and rescan plug-ins." > "$OUT/INSTALL.txt"
              zip -qry "$OUT.zip" "$OUT" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: AIMixAssistant-${{ runner.os }}
          path: AIMixAssistant-${{ runner.os }}.zip
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: AIMixAssistant-macOS-installer
          path: AIMixAssistant-macOS.pkg
          compression-level: 0

  # Install the exact zip people download onto the newest macOS on Apple
  # Silicon and validate it there, as a fresh user would.
  verify-macos-latest:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AIMixAssistant-macOS-installer
      - name: Install with the .pkg, like a user
        run: |
          sw_vers; uname -m
          sudo installer -pkg AIMixAssistant-macOS.pkg -target /
          P=/Library/Audio/Plug-Ins
          codesign --verify --deep --strict "$P/Components/AI Mix Assistant.component"
          codesign --verify --deep --strict "$P/VST3/AI Mix Assistant.vst3"
          codesign --verify --deep --strict "/Applications/AI Mix Assistant.app"
          killall -9 AudioComponentRegistrar || true
      - name: auval (AU, native arm64)
        run: auval -v aufx Aima Aimx
      - name: pluginval (AU + VST3)
        run: |
          curl -sSLo pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip && unzip -q pv.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --validate-in-process "/Library/Audio/Plug-Ins/VST3/AI Mix Assistant.vst3"
          $PV --strictness-level 10 --validate-in-process "/Library/Audio/Plug-Ins/Components/AI Mix Assistant.component"
      - name: Standalone launches
        run: |
          "/Applications/AI Mix Assistant.app/Contents/MacOS/AI Mix Assistant" & PID=$!
          sleep 10; kill -0 $PID && echo "still running after 10 s"; kill $PID

  # Direct download links (no zip from the Actions page) for builds of main
  # that passed the macOS check:
  #   https://github.com/kalprod/ai-mix-assistant/releases/latest/download/AIMixAssistant-macOS.pkg
  publish:
    needs: [build, verify-macos-latest]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest --target "$GITHUB_SHA" --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Mac: download AIMixAssistant-macOS.pkg and double-click it. Windows: AIMixAssistant-Windows.zip." \
            dist/AIMixAssistant-macOS.pkg dist/AIMixAssistant-Windows.zip dist/AIMixAssistant-Linux.zip dist/AIMixAssistant-macOS.zip
