# Builds and validates the plugin on macOS (VST3 + AU), Windows (VST3) and Linux (VST3).
name: build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb ninja-build

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (VST3)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   curl -sSLo pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip && unzip -q pv.zip && PV=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) curl -sSLo pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip && unzip -q pv.zip && PV=./pluginval.exe ;;
            Linux)   curl -sSLo pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip && unzip -q pv.zip && PV="xvfb-run -a ./pluginval" ;;
          esac
          VST3=$(find build -name "*.vst3" -maxdepth 5 -type d | head -1)
          $PV --strictness-level 10 --validate-in-process "$VST3"

      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$(find build -name '*.component' -maxdepth 5 -type d | head -1)" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Aima Aimx

      # Zip inside the job: GitHub's artifact upload drops file permissions,
      # which would leave the macOS bundles unable to load.
      - name: Package
        shell: bash
        run: |
          OUT="AIMixAssistant-${{ runner.os }}"
          REL=$(dirname "$(find build -path '*AIMixAssistant_artefacts/Release/VST3' -maxdepth 4 -type d | head -1)")
          mkdir -p "$OUT"
          cp -R "$REL/VST3/"*.vst3 "$OUT/"
          case "${{ runner.os }}" in
            macOS)
              cp -R "$REL/AU/"*.component "$OUT/"
              cp -R "$REL/Standalone/"*.app "$OUT/"
              printf '%s\n' \
                "AI Mix Assistant for macOS (Apple Silicon + Intel)" "" \
                "1. Copy 'AI Mix Assistant.component' to ~/Library/Audio/Plug-Ins/Components/  (Logic, GarageBand)" \
                "2. Copy 'AI Mix Assistant.vst3' to ~/Library/Audio/Plug-Ins/VST3/  (Ableton, Cubase, Reaper, Bitwig...)" \
                "3. This build is not notarized. In Terminal run:" \
                "   xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/'AI Mix Assistant.component' ~/Library/Audio/Plug-Ins/VST3/'AI Mix Assistant.vst3'" \
                "4. Restart your DAW and rescan plug-ins." > "$OUT/INSTALL.txt"
              ditto -c -k --keepParent "$OUT" "$OUT.zip" ;;
            Windows)
              cp "$REL/Standalone/"*.exe "$OUT/"
              printf '%s\r\n' \
                "AI Mix Assistant for Windows (64-bit)" "" \
                '1. Copy the "AI Mix Assistant.vst3" folder to C:\Program Files\Common Files\VST3' \
                "2. Restart your DAW and rescan plug-ins." \
                "If Windows SmartScreen warns about the standalone .exe, choose More info > Run anyway." > "$OUT/INSTALL.txt"
              7z a -tzip "$OUT.zip" "$OUT" > /dev/null ;;
            Linux)
              cp "$REL/Standalone/"* "$OUT/"
              printf '%s\n' \
                "AI Mix Assistant for Linux (x86-64)" "" \
                "1. Copy 'AI Mix Assistant.vst3' to ~/.vst3/" \
                "2. Needs libasound2, libfreetype6 and libfontconfig1." \
                "3. Restart your DAW and rescan plug-ins." > "$OUT/INSTALL.txt"
              zip -qry "$OUT.zip" "$OUT" ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: AIMixAssistant-${{ runner.os }}
          path: AIMixAssistant-${{ runner.os }}.zip
          compression-level: 0
